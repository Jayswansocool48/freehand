<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px #000; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); color: #fff; text-align: center; cursor: pointer; }
    #overlay[hidden] { display: none; }
    #overlay h1 { margin: 0 0 8px; font-size: 40px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="hud"></div>
  <div id="overlay"><h1>{{TITLE}}</h1><p>W/S or Up/Down to drive, A/D or Left/Right to turn. Press Space or click to start.</p></div>
  <script type="module" src="main.js"></script>
</body>
</html>
