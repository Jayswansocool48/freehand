<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model viewer</title>
<style>
  :root { --bg: #efefeb; --fg: #1c1f24; --muted: #646a73; --panel: rgba(255,255,255,.85); --line: rgba(0,0,0,.1); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1d21; --fg: #e9eaec; --muted: #9aa0a8; --panel: rgba(30,33,38,.85); --line: rgba(255,255,255,.12); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .hud { position: fixed; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; right: 10px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; color: var(--muted); }
  button, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }</script>
</head>
<body>
<div id="msg" class="msg">Loading model</div>
<div class="hud">
  <span id="info" class="chip" hidden></span>
  <select id="clips" hidden aria-label="Animation"></select>
  <button id="wire" type="button" hidden>Wireframe</button>
  <button id="spin" type="button" hidden>Turntable</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const src = new URLSearchParams(location.search).get('src') || '';
const msg = document.getElementById('msg');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? 0x1b1d21 : 0xefefeb);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x30343a : 0x8a8f96, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 4);
scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const ext = (src.split('?')[0].split('.').pop() || '').toLowerCase();
const loaders = { glb: GLTFLoader, gltf: GLTFLoader, obj: OBJLoader, fbx: FBXLoader, stl: STLLoader };
let mixer = null;
const clock = new THREE.Clock();

function show(root, clips) {
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.001);
  const grid = new THREE.GridHelper(radius * 4, 20, dark ? 0x555b63 : 0xb5b9bf, dark ? 0x33373d : 0xd6d8dc);
  grid.position.y = box.min.y;
  scene.add(grid);
  camera.position.copy(center).add(new THREE.Vector3(radius * 1.6, radius * 1.1, radius * 2.2));
  camera.near = radius / 100; camera.far = radius * 100; camera.updateProjectionMatrix();
  controls.target.copy(center);
  let tris = 0, meshes = 0;
  root.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const info = document.getElementById('info');
  info.textContent = `${meshes} mesh${meshes === 1 ? '' : 'es'} · ${Math.round(tris).toLocaleString()} triangles · ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;
  info.hidden = false;
  const wire = document.getElementById('wire');
  wire.hidden = false;
  wire.onclick = () => root.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => { m.wireframe = !m.wireframe; }); });
  const spin = document.getElementById('spin');
  spin.hidden = false;
  spin.onclick = () => { controls.autoRotate = !controls.autoRotate; };
  if (clips && clips.length) {
    mixer = new THREE.AnimationMixer(root);
    const sel = document.getElementById('clips');
    sel.hidden = false;
    sel.innerHTML = '<option value="-1">No animation</option>' + clips.map((c, i) => `<option value="${i}">${c.name ? c.name.replace(/[<>&"]/g, '') : 'Clip ' + (i + 1)}</option>`).join('');
    const play = (i) => { mixer.stopAllAction(); if (i >= 0) mixer.clipAction(clips[i]).play(); };
    sel.onchange = () => play(Number(sel.value));
    sel.value = '0';
    play(0);
  }
  msg.remove();
}

if (!loaders[ext]) msg.textContent = 'This file type cannot be shown. Use .glb, .gltf, .obj, .fbx or .stl.';
else {
  new loaders[ext]().load(src, (res) => {
    if (ext === 'stl') return show(new THREE.Mesh(res, new THREE.MeshStandardMaterial({ color: 0x9aa4b1, roughness: 0.6 })), []);
    if (res.scene) return show(res.scene, res.animations);
    show(res, res.animations || []);
  }, undefined, (e) => { msg.textContent = 'Could not load this model: ' + (e && e.message ? e.message : 'unknown error'); });
}

renderer.setAnimationLoop(() => { if (mixer) mixer.update(clock.getDelta()); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
