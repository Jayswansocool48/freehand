<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-src http://127.0.0.1:*">
  <title>Freehand</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%231e293b'/%3E%3Cpath d='M144 32 64 144h56l-8 80 80-112h-56z' fill='%23f8fafc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Freehand">
    <div class="brand">
      <span class="brand-mark" data-icon="lightning"></span>
      <b>Freehand</b>
      <button id="toggle-sidebar" class="icon-btn" title="Collapse sidebar (Ctrl B)" aria-label="Collapse sidebar"><span data-icon="sidebar-simple"></span></button>
    </div>
    <nav class="nav" aria-label="Main">
      <button id="new-task" class="nav-item nav-new"><span data-icon="plus" class="ni"></span><span>New task</span><kbd class="kbd">Ctrl N</kbd></button>
      <button id="open-search" class="nav-item"><span data-icon="magnifying-glass" class="ni"></span><span>Search</span><kbd class="kbd">Ctrl K</kbd></button>
      <div class="nav-label">Recents</div>
      <div id="task-list"></div>
    </nav>
    <div class="nav-foot">
      <button id="profile-btn" class="profile-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" data-icon="lightning"></span>
        <div class="grow"><b>Freehand</b><small id="profile-model">Loading model...</small></div>
        <span data-icon="caret-up" class="muted"></span>
      </button>
      <div id="profile-menu" class="menu" data-side="up" role="menu" hidden></div>
    </div>
  </aside>

  <main id="main" class="main">
    <!-- Home: greeting, composer, starting points -->
    <section id="view-home" class="home" aria-label="New task">
      <div class="home-inner">
        <h1 class="greeting"><span data-icon="lightning"></span><span id="greet-text">What can I get done for you?</span></h1>
        <div id="composer-home-slot"></div>
        <div id="home-chips" class="chips" aria-label="Starting points"></div>
        <div id="home-recent" class="home-recent" hidden>
          <h2>Recent tasks</h2>
          <div id="home-recent-list" class="list"></div>
        </div>
      </div>
    </section>

    <!-- Task: the conversation with the agent -->
    <section id="view-task" class="chat-view" aria-label="Task" hidden>
      <header id="topbar" class="chat-head">
        <button id="task-title" class="chat-title" aria-haspopup="menu" aria-expanded="false"><span id="task-title-text">New task</span><span data-icon="caret-down" class="muted"></span></button>
        <div id="title-menu" class="menu" data-side="down" role="menu" hidden></div>
        <span id="status-pill" class="pill" hidden></span>
        <span class="grow"></span>
        <button id="toggle-computer" class="btn btn-quiet" title="Show Freehand's computer (Ctrl Shift C)"><span data-icon="desktop"></span>Computer</button>
      </header>
      <div id="thread" class="thread"><div id="timeline" class="thread-inner" aria-live="polite"></div></div>
      <button id="jump" class="btn jump" hidden><span data-icon="arrow-down"></span>Jump to latest</button>
      <div class="composer">
        <div id="progress" class="progress" hidden>
          <ol id="progress-list" hidden></ol>
          <button id="progress-toggle" type="button" aria-expanded="false">
            <span id="progress-icon"></span>
            <span id="progress-cur" class="cur"></span>
            <span id="progress-count" class="count"></span>
            <span data-icon="caret-up" class="muted"></span>
          </button>
        </div>
        <div id="composer-task-slot"></div>
      </div>
    </section>

    <!-- Settings: section list on the left, like Claude's -->
    <section id="view-settings" class="page" aria-label="Settings" hidden>
      <div class="page-head page-narrow-wide">
        <div><h1>Settings</h1></div>
        <button id="settings-close" class="btn btn-quiet"><span data-icon="x"></span>Close <kbd class="kbd">Esc</kbd></button>
      </div>
      <div class="settings">
        <nav id="settings-nav" class="settings-nav" aria-label="Settings sections"></nav>
        <div id="settings-body" class="settings-body"></div>
      </div>
    </section>
  </main>

  <aside id="computer" aria-label="Freehand's computer">
    <div class="cp-head">
      <div class="cp-title"><span data-icon="desktop"></span>Freehand's computer</div>
      <div class="segmented" role="radiogroup" aria-label="Computer view">
        <button class="cp-tab" data-cp="live" role="radio" aria-checked="true">Live</button>
        <button class="cp-tab" data-cp="play" role="radio" aria-checked="false">Play</button>
        <button class="cp-tab" data-cp="files" role="radio" aria-checked="false">Files</button>
      </div>
      <button id="cp-close" class="icon-btn" aria-label="Close panel"><span data-icon="x"></span></button>
    </div>
    <div id="cp-status" class="cp-status"></div>
    <div id="cp-body" class="cp-body"></div>
    <div id="cp-timeline" class="cp-timeline">
      <button id="cp-prev" class="icon-btn" aria-label="Previous step"><span data-icon="caret-left"></span></button>
      <input id="cp-slider" type="range" min="0" max="0" value="0" aria-label="Scrub through steps">
      <button id="cp-next" class="icon-btn" aria-label="Next step"><span data-icon="caret-right"></span></button>
      <button id="cp-live" class="btn" hidden><span data-icon="arrow-down"></span>Jump to live</button>
    </div>
  </aside>
</div>

<!-- One composer, moved between the home screen and the task view -->
<template id="composer-tpl">
  <form id="composer" class="composer-box" autocomplete="off">
    <div id="attachments" class="attachments" hidden></div>
    <textarea id="input" rows="1" placeholder="Describe a task" aria-label="Task or reply"></textarea>
    <div class="composer-foot">
      <div class="grow">
        <button type="button" id="attach" class="icon-btn" title="Attach files: 3D models, images, sounds" aria-label="Attach files"><span data-icon="paperclip"></span></button>
        <input type="file" id="attach-input" multiple hidden>
        <button type="button" id="model-chip" class="picker" aria-haspopup="menu" aria-expanded="false" title="Choose model"></button>
        <button type="button" id="effort-chip" class="picker" aria-haspopup="menu" aria-expanded="false" title="Effort: how hard Freehand works on each task"></button>
        <button type="button" id="safety-chip" class="picker" aria-haspopup="menu" aria-expanded="false" title="Shell and Python commands: ask first, or run without asking"></button>
        <div id="model-pop" class="menu" data-side="up" role="menu" hidden></div>
      </div>
      <button type="button" id="stop" class="send send-stop" title="Stop (Esc)" aria-label="Stop" hidden><span data-icon="stop"></span></button>
      <button type="submit" id="send" class="send" title="Send" aria-label="Send" disabled><span data-icon="arrow-up"></span></button>
    </div>
  </form>
</template>

<div id="cmdk" class="scrim cmdk-scrim" hidden>
  <div class="cmdk" role="dialog" aria-label="Search tasks and actions">
    <input id="cmdk-input" placeholder="Search tasks and actions" aria-label="Search tasks and actions" autocomplete="off">
    <div id="cmdk-list" class="cmdk-list" role="listbox"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
